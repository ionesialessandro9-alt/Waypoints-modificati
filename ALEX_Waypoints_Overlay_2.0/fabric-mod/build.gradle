plugins {
    id 'net.fabricmc.fabric-loom' version '1.11-SNAPSHOT'
}
version = '2.0.0'
group = 'it.alex.waypoints'
base { archivesName = 'alex-waypoints' }
repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.8'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.134.0+1.21.8'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
